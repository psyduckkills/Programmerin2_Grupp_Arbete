<!doctype html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Medeltemperatur</title></head>
<body>
    <h1>Medeltemperatur per månad</h1>
    <table border="1" cellpadding="5">
        <tr><th>Månad</th><th>°C (Medeltemperatur)</th></tr>
        {% for item in data %}
        <tr>
            <td>{{ item.month }}</td>
            <td>{{ item.avg_temp }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">Tillbaka</a>
</body>
</html>
