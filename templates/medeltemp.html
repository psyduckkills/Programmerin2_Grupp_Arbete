<!doctype html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Medeltemperatur</title></head>

<head><meta charset="UTF-8"><title style="text-align: center;">Medeltemperatur</title></head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 <style>
    body {
      background-image: url("/static/clouds.gif");
      background-size: cover;         /* fill the whole window */
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;   /* stays put when you scroll */
      margin: 0;
      min-height: 100vh;
    }
  </style>
<body class="container">
    <a href="/">Tillbaka</a>
    <h1 style="text-align: center;">Medeltemperatur</h1>
     <h2 style="text-align: center;"> STOCKHOLM</h2>
     <form method="get" class="row g-2 mb-3 justify-content-center text-center">
            <div class="col-auto">
                <label for="start" class="form-label">Från</label>
                <input type="date" id="start" name="start" class="form-control" value="{{ start or ''}}">
            </div>
            <div class="col-auto">
                <label for="slut" class="form-label">Till</label>
                <input type="date" id="slut" name="slut" class="form-control" value="{{ slut or ''}}">
            </div>
            <div class="col-auto align-self-end">
                <button type="submit" class="btn btn-dark">Visa</button>
                <a href="/vader" class="btn btn-outline-secondary">Återställ</a>
            </div>
        <div id="chart">{{ chart | safe }}</div>
        <footer class ="mt-4 mb-3 text">
    <p style="text-align: center;">
        <a href="https://open-meteo.com/" >Väder data från Open-Meteo.com</a>,
        licensierad under
        <a href="https://creativecommons.org/licenses/by/4.0/deed.sv"> CC BY 4.0</a>,
        Datan har bearbetats till månadsvärden
    </p>
</footer>
    </body>

</html>
