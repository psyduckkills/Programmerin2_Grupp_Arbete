<!doctype html>
<html lang="sv">
<head><meta charset="UTF-8"><title>Medeltemperatur</title></head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
<body>

    <a href="/">Tillbaka</a>
    {% include "formular.html" %}

    {% if error %}
        <div class="alert alert-warning mt-4">{{ error }}</div>
    {% endif %}

    {% if selected_date %}
        <h4 class="mt-4", style="text-align: center;">Väder för {{ selected_date }}</h4>
        <p style="text-align: center;">Medeltemperatur: {{ mean_temp }} °C</p>
        <p style="text-align: center;">Nederbörd: {{ precipitation }} mm</p>
    {% endif %}

    {% if plot_html %}
        <div class="mt-3">
            {{ plot_html | safe }}
        </div>
    {% endif %}

</div>
    
</form>
</body>

</html>
